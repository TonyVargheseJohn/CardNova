{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password | CardNova</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .user-layout { display: flex; min-height: 100vh; }
        .user-sidebar { width: 240px; background: var(--bg-secondary); border-right: 1px solid var(--border); padding: 1.5rem; position: sticky; top: 0; height: 100vh; }
        .user-sidebar .logo { font-size: 1.4rem; font-weight: 800; color: var(--accent); margin-bottom: 2rem; display: block; }
        .user-sidebar nav a { display: block; padding: 0.8rem 1rem; color: var(--text-secondary); text-decoration: none; border-radius: 6px; margin-bottom: 0.5rem; }
        .user-sidebar nav a:hover, .user-sidebar nav a.active { background: var(--bg-card); color: var(--accent); }
        .user-main { flex: 1; padding: 2rem; }
        .form-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 2rem; max-width: 500px; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; color: var(--text-secondary); }
        .form-group input { width: 100%; padding: 0.8rem; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); }
        .form-group input:focus { outline: none; border-color: var(--accent); }
        .btn { padding: 0.7rem 1.5rem; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; }
        .btn-primary { background: var(--accent); color: #fff; }
        .alert { padding: 0.8rem; border-radius: 6px; margin-bottom: 1rem; }
        .alert-error { background: rgba(255,71,87,0.15); border: 1px solid var(--danger); color: var(--danger); }
        @media (max-width: 768px) { .user-layout { flex-direction: column; } .user-sidebar { width: 100%; height: auto; position: relative; } }
    </style>
</head>
<body>
    <div class="user-layout">
        <aside class="user-sidebar">
            <span class="logo">CardNova</span>
            <nav>
                <a href="{% url 'user:home' %}">🏠 Home</a>
                <a href="{% url 'user:profile' %}" class="active">👤 My Profile</a>
                <a href="#">📦 Orders</a>
                <hr style="border-color: var(--border); margin: 1rem 0;">
                <a href="{% url 'user:logout' %}" style="color: var(--danger);">Logout</a>
            </nav>
        </aside>
        <main class="user-main">
            <h2 style="margin-bottom: 1.5rem;">Change Password</h2>
            {% if messages %}{% for msg in messages %}<div class="alert alert-{{ msg.tags }}">{{ msg }}</div>{% endfor %}{% endif %}
            <div class="form-card">
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group"><label>Current Password</label><input type="password" name="old_password" required></div>
                    <div class="form-group"><label>New Password</label><input type="password" name="new_password" required></div>
                    <div class="form-group"><label>Confirm New Password</label><input type="password" name="confirm_password" required></div>
                    <button type="submit" class="btn btn-primary">Update Password</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
